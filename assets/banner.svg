<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Jev steer or queue</title>
  <desc id="d">A message sent while a coding agent is working is routed by Jev to steer, queue, or interrupt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <marker id="a-jev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7c5cff"/>
    </marker>
    <marker id="a-steer" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3fb8af"/>
    </marker>
    <marker id="a-queue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f5b544"/>
    </marker>
    <marker id="a-stop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff6b6b"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- left: title -->
  <g class="sans">
    <text x="72" y="92" fill="#8b949e" font-size="18" letter-spacing="3" font-weight="600">HOOKS · CLAUDE CODE · CODEX</text>
    <text x="70" y="168" fill="#f0f6fc" font-size="64" font-weight="800" letter-spacing="-1.5">Jev steer</text>
    <text x="70" y="238" fill="#f0f6fc" font-size="64" font-weight="800" letter-spacing="-1.5">or <tspan fill="#f5b544">queue</tspan></text>
    <text x="72" y="290" fill="#c9d1d9" font-size="22">Your agent is busy. You send another message.</text>
    <text x="72" y="322" fill="#c9d1d9" font-size="22">A ~0.5s classifier decides what it means.</text>
  </g>

  <!-- right: flow -->
  <g class="sans">
    <!-- message bubble -->
    <rect x="628" y="176" width="190" height="68" rx="16" fill="#21262d" stroke="#30363d"/>
    <text x="648" y="203" fill="#8b949e" font-size="13" class="mono">mid-turn message</text>
    <text x="648" y="228" fill="#f0f6fc" font-size="17">“做完再看支付回调”</text>

    <path d="M822 210H872" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#a-jev)"/>

    <!-- Jev chip -->
    <rect x="878" y="172" width="120" height="76" rx="18" fill="#7c5cff"/>
    <text x="938" y="210" fill="#ffffff" font-size="26" font-weight="800" text-anchor="middle">Jev</text>
    <text x="938" y="234" fill="#e6dcff" font-size="13" text-anchor="middle" class="mono">~0.5 s</text>

    <!-- branches -->
    <path d="M998 196C1030 196 1030 108 1062 108" fill="none" stroke="#3fb8af" stroke-width="2.5" marker-end="url(#a-steer)"/>
    <path d="M998 210H1060" fill="none" stroke="#f5b544" stroke-width="3.5" marker-end="url(#a-queue)"/>
    <path d="M998 224C1030 224 1030 312 1062 312" fill="none" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#a-stop)"/>

    <g>
      <rect x="1068" y="80" width="150" height="56" rx="14" fill="#3fb8af" fill-opacity="0.14" stroke="#3fb8af"/>
      <text x="1088" y="106" fill="#3fb8af" font-size="19" font-weight="700">steer</text>
      <text x="1088" y="126" fill="#9fdcd6" font-size="13">change course now</text>
    </g>
    <g>
      <rect x="1068" y="182" width="150" height="56" rx="14" fill="#f5b544" fill-opacity="0.16" stroke="#f5b544"/>
      <text x="1088" y="208" fill="#f5b544" font-size="19" font-weight="700">queue</text>
      <text x="1088" y="228" fill="#f7d79a" font-size="13">run after this turn</text>
    </g>
    <g>
      <rect x="1068" y="284" width="150" height="56" rx="14" fill="#ff6b6b" fill-opacity="0.14" stroke="#ff6b6b"/>
      <text x="1088" y="310" fill="#ff6b6b" font-size="19" font-weight="700">interrupt</text>
      <text x="1088" y="330" fill="#ffb3b3" font-size="13">stop at next tool</text>
    </g>
  </g>

  <text x="72" y="376" fill="#6e7681" font-size="15" class="mono">UserPromptSubmit → Jev → block / allow / continue:false</text>
</svg>
